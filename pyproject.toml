[project]
name = "notebook-kube1"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "python-multipart==0.0.33",
    "uvicorn>=0.34,<1",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.15,<2",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.28,<1",
    "httpcore>=1,<2",
    "pyjwt[crypto]>=2.10,<3",
    "bitwarden-sdk>=2.1.0",
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests", "tests/security"]
[tool.pyright]
extraPaths = ["backend"]
[tool.ruff]
target-version = "py312"
line-length = 100
