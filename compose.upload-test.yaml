---
# Private upload test overlay; not used by the login deployment helper.
# Use only with a separate project, database and runtime directory.
name: notebook-upload-test
services:
  frontend:
    profiles: [upload-test-browser]
  api:
    command:
      - python
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - '8000'
      - --no-access-log
      - --no-proxy-headers
    environment:
      NOTEBOOK_LOCAL_UPLOADS_ENABLED: 'true'
      NOTEBOOK_LOCAL_STORAGE_ROOT: /var/lib/notebook-originals
      NOTEBOOK_STORAGE_IO_DATABASE_URL_FILE: /run/notebook-upload/db-url
    volumes:
      - type: bind
        source: ${NOTEBOOK_UPLOAD_TEST_ORIGINALS:?private originals required}
        target: /var/lib/notebook-originals
        bind:
          create_host_path: false
      - type: bind
        source: ${NOTEBOOK_UPLOAD_TEST_IO_FILE:?IO file required}
        target: /run/notebook-upload/db-url
        read_only: true
        bind:
          create_host_path: false
  text-worker:
    profiles: [upload-test-worker]
    image: ${NOTEBOOK_POC_API_IMAGE:?immutable GHCR digest required}
    user: '10001:10001'
    command: [python, -m, app.workers.local_runtime]
    environment:
      NOTEBOOK_LOCAL_TEXT_WORKER_ENABLED: 'true'
      NOTEBOOK_LOCAL_STORAGE_ROOT: /var/lib/notebook-originals
      NOTEBOOK_DATABASE_URL_FILE: /run/notebook-worker/app-db-url
      NOTEBOOK_TEXT_SCHEDULER_DATABASE_URL_FILE: /run/notebook-worker/scheduler
    volumes:
      - type: bind
        source: ${NOTEBOOK_UPLOAD_TEST_ORIGINALS:?private originals required}
        target: /var/lib/notebook-originals
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: >-
          ${NOTEBOOK_POC_SECRETS:?required}/api/notebook_database_url
        target: /run/notebook-worker/app-db-url
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${NOTEBOOK_UPLOAD_TEST_SCHEDULER_FILE:?scheduler file required}
        target: /run/notebook-worker/scheduler
        read_only: true
        bind:
          create_host_path: false
    networks: [private]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m,mode=1777']
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    restart: 'no'
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
