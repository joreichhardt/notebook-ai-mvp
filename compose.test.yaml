# kube1-only disposable foundation test overlay; not a production deployment.
# Use with compose.yaml, --env-file /dev/null and a unique project name.
# Set NOTEBOOK_TEST_PORT explicitly to the assigned kube1 loopback port.
services:
  api:
    restart: "no"
    environment:
      NOTEBOOK_PUBLIC_ORIGIN: https://localhost
  frontend:
    restart: "no"
