---
# TEMPLATE ONLY. Copy to the always-private ops repository after host review.
name: Deploy approved Notebook login PoC
'on':
  workflow_dispatch:
    inputs:
      app_commit:
        description: Reviewed public APP commit (not the private ops commit)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: notebook-poc-owned-runtime
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.repository == 'joreichhardt/notebook-ai-deploy' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'joreichhardt' &&
      github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, notebook-poc-private]
    timeout-minutes: 20
    # Root-owned expiring host approval is mandatory. GitHub required-reviewer
    # environments are additional only if actually supported and configured.
    steps:
      - name: Invoke only the separately installed allowlisted host helper
        env:
          APP_COMMIT: ${{ inputs.app_commit }}
        run: |
          set -eu
          exec /usr/bin/sudo -n -u notebook-poc \
            /usr/local/libexec/notebook-poc-deploy "$APP_COMMIT"
