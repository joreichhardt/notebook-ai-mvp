pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 25m;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        location /api/ {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Forwarded-For "";
            proxy_buffering off;
            proxy_read_timeout 180s;
            add_header Cache-Control no-store always;
        }
        # Supabase public routes require an audited allowlist in the release stack.
        location /auth/v1/ { return 503; }
        # Reserved infrastructure routes must not fall through to the SPA.
        location ~ ^/(?:rest/v1|storage/v1|studio|pg|auth/v1/admin)(?:/|$) { return 404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
