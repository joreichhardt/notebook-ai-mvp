pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 64k;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    server {
        listen 8080;
        server_name note.yokoma.de;
        if ($host != note.yokoma.de) { return 421; }
        root /usr/share/nginx/html;
        location /api/ {
            proxy_pass http://api:8000;
            proxy_set_header Host note.yokoma.de;
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Forwarded-For "";
            proxy_hide_header Cache-Control;
            proxy_buffering off;
            proxy_read_timeout 15s;
        }
        location /auth/ { return 503; }
        # Reserved infrastructure routes must not fall through to the SPA.
        location ~ ^/(?:rest/v1|storage/v1|studio|pg|auth/v1/admin)(?:/|$) { return 404; }
        location = /confirmation.html { return 404; }
        location / { try_files $uri $uri/ /index.html; }
    }
    # Unpublished container port, exclusively the BFF's fixed GoTrue operations.
    server {
        listen 8081;
        location ~ ^/auth/v1/(token|user|logout|health)$ {
            rewrite ^/auth/v1/(.*)$ /$1 break;
            proxy_pass http://auth:9999;
            proxy_set_header Host auth;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_buffering off;
            proxy_read_timeout 10s;
        }
        location = /confirmation.html {
            alias /opt/poc-confirmation.html;
            default_type text/html;
        }
        location / { return 404; }
    }
}
